<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 管理后台</title>
    <style>
        /* ========== 梦幻浅色主题 ========== */
        :root[data-theme="light"] {
            --bg-primary: #faf5ff;
            --bg-secondary: #ffffff;
            --bg-sidebar: #f8f0ff;
            --text-primary: #2d1b4e;
            --text-secondary: #5a4575;
            --text-muted: #9a85b5;
            --border-color: #e8dff5;
            --accent-primary: #a855f7;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #c084fc 0%, #a855f7 25%, #ec4899 50%, #f472b6 75%, #fb7185 100%);
            --accent-glow: 0 0 20px rgba(168, 85, 247, 0.3);
            --accent-glow-strong: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 60px rgba(236, 72, 153, 0.3);
            --hover-bg: rgba(168, 85, 247, 0.05);
            --shadow-sm: 0 2px 12px rgba(168, 85, 247, 0.08);
            --shadow-md: 0 4px 24px rgba(168, 85, 247, 0.12), 0 2px 8px rgba(236, 72, 153, 0.06);
            --shadow-lg: 0 10px 40px rgba(168, 85, 247, 0.15), 0 4px 16px rgba(236, 72, 153, 0.08);
            --code-bg: #f5f0ff;
            --tag-bg: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.1));
            --tag-text: #9333ea;
            --card-gradient: linear-gradient(135deg, rgba(192, 132, 252, 0.05) 0%, rgba(244, 114, 182, 0.05) 100%);
            --blur-bg: blur(20px);
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, #faf5ff 0%, #fff0f5 50%, #f0f5ff 100%);
            background-attachment: fixed;
            position: relative;
        }

        [data-theme="light"] body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(192, 132, 252, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        [data-theme="light"] .header {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        [data-theme="light"] .navbar-brand {
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4));
        }

        [data-theme="light"] .navbar-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #7c3aed;
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .navbar-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #a855f7;
            box-shadow: var(--accent-glow);
            transform: translateY(-2px);
        }

        [data-theme="light"] .navbar-btn.primary {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            font-weight: 600;
            box-shadow: var(--accent-glow);
        }

        [data-theme="light"] .navbar-btn.primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="light"] .sidebar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: var(--shadow-md);
        }

        [data-theme="light"] .stat-item {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: var(--shadow-sm);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
        }

        [data-theme="light"] .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="light"] .stat-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        [data-theme="light"] .article-item {
            border: 1px solid rgba(168, 85, 247, 0.1);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .article-item:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        [data-theme="light"] .article-item.active {
            background: linear-gradient(90deg, rgba(192, 132, 252, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            border-color: #a855f7;
            box-shadow: var(--accent-glow);
        }

        [data-theme="light"] .content-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: var(--shadow-lg);
        }

        [data-theme="light"] .form-input,
        [data-theme="light"] .editor-input,
        [data-theme="light"] .editor-select,
        [data-theme="light"] .editor-textarea {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--text-primary);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
        }

        [data-theme="light"] .form-input:focus,
        [data-theme="light"] .editor-input:focus,
        [data-theme="light"] .editor-select:focus,
        [data-theme="light"] .editor-textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1), var(--accent-glow);
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        [data-theme="light"] .btn {
            background: linear-gradient(135deg, #c084fc, #ec4899);
            border: none;
            color: white;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .btn:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="light"] .btn-danger {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
        }

        [data-theme="light"] .btn-danger:hover {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.5);
        }

        [data-theme="light"] .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid rgba(168, 85, 247, 0.2);
            font-size: 0.75rem;
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: var(--shadow-lg), var(--accent-glow);
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        [data-theme="light"] .theme-toggle::before {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        [data-theme="light"] .footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
        }

        [data-theme="light"] .empty-state-icon {
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        [data-theme="light"] ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        [data-theme="light"] ::-webkit-scrollbar-track {
            background: rgba(168, 85, 247, 0.05);
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #c084fc, #ec4899);
            border-radius: 4px;
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #a855f7, #db2777);
        }

        [data-theme="light"] ::selection {
            background: rgba(168, 85, 247, 0.2);
            color: #7c3aed;
        }


                /* ========== 炫彩黑主题 ========== */
        :root[data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-sidebar: #0d0d15;
            --text-primary: #e8e8ff;
            --text-secondary: #b0b0cc;
            --text-muted: #5a5a7a;
            --border-color: #1e1e3a;
            --accent-primary: #00f5ff;
            --accent-secondary: #ff00aa;
            --accent-gradient: linear-gradient(135deg, #00f5ff 0%, #7b2dff 25%, #ff00aa 50%, #ffaa00 75%, #00ff88 100%);
            --accent-glow: 0 0 25px rgba(0, 245, 255, 0.6), 0 0 50px rgba(123, 45, 255, 0.3);
            --accent-glow-strong: 0 0 40px rgba(0, 245, 255, 0.8), 0 0 80px rgba(255, 0, 170, 0.4);
            --hover-bg: rgba(0, 245, 255, 0.08);
            --shadow-sm: 0 2px 15px rgba(0, 0, 0, 0.6);
            --shadow-md: 0 4px 25px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 245, 255, 0.1);
            --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(123, 45, 255, 0.2);
            --code-bg: #0a0a18;
            --tag-bg: linear-gradient(135deg, rgba(0, 245, 255, 0.15), rgba(255, 0, 170, 0.15));
            --tag-text: #00f5ff;
            --rainbow-border: linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff);
        }

        [data-theme="dark"] body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(0, 245, 255, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 0, 170, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(123, 45, 255, 0.05) 0%, transparent 60%);
            position: relative;
        }

        [data-theme="dark"] body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 0%, rgba(0, 245, 255, 0.02) 50%, transparent 100%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 245, 255, 0.015) 2px,
                    rgba(0, 245, 255, 0.015) 4px
                );
            pointer-events: none;
            z-index: 0;
        }

        [data-theme="dark"] .header {
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.95) 0%, rgba(18, 18, 26, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
            border-image: var(--rainbow-border) 1;
            box-shadow: 0 4px 30px rgba(0, 245, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        [data-theme="dark"] .navbar-brand {
            font-weight: 700;
            background: linear-gradient(90deg, #00f5ff, #7b2dff, #ff00aa, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.6));
        }

        [data-theme="dark"] .nav-btn {
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.3);
            color: #00f5ff;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .nav-btn:hover {
            background: rgba(0, 245, 255, 0.15);
            border-color: #00f5ff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        [data-theme="dark"] .nav-btn.primary {
            background: linear-gradient(135deg, #00f5ff, #7b2dff);
            color: #fff;
            border: none;
        }

        [data-theme="dark"] .sidebar {
            background: linear-gradient(180deg, rgba(13, 13, 21, 0.95) 0%, rgba(18, 18, 26, 0.95) 100%);
            border-right: 1px solid transparent;
            border-image: var(--rainbow-border) 1;
        }

        [data-theme="dark"] .stat-item {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.08) 0%, rgba(123, 45, 255, 0.08) 100%);
            border: 1px solid rgba(0, 245, 255, 0.2);
        }

        [data-theme="dark"] .stat-number {
            background: linear-gradient(90deg, #00f5ff, #7b2dff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="dark"] .form-input,
        [data-theme="dark"] .editor-input,
        [data-theme="dark"] .editor-textarea {
            background: rgba(10, 10, 18, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        [data-theme="dark"] .form-input:focus,
        [data-theme="dark"] .editor-input:focus,
        [data-theme="dark"] .editor-textarea:focus {
            border-color: #00f5ff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            outline: none;
        }

        [data-theme="dark"] .btn {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(123, 45, 255, 0.2));
            border: 1px solid rgba(0, 245, 255, 0.4);
            color: #00f5ff;
        }

        [data-theme="dark"] .btn-primary {
            background: linear-gradient(135deg, #00f5ff, #7b2dff);
            border: none;
            color: #fff;
        }

        [data-theme="dark"] .btn-danger {
            background: linear-gradient(135deg, #ff0055, #ff00aa);
            border: none;
            color: #fff;
        }

        [data-theme="dark"] .article-item {
            border: 1px solid var(--border-color);
            background: rgba(0, 245, 255, 0.03);
        }

        [data-theme="dark"] .article-item:hover {
            border-color: rgba(0, 245, 255, 0.4);
            background: rgba(0, 245, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
        }

        [data-theme="dark"] .article-item.active {
            background: linear-gradient(90deg, rgba(0, 245, 255, 0.15) 0%, rgba(123, 45, 255, 0.15) 100%);
            border-color: #00f5ff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        [data-theme="dark"] .login-card {
            background: linear-gradient(135deg, rgba(18, 18, 26, 0.9), rgba(13, 13, 21, 0.9));
            border: 1px solid rgba(0, 245, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
        }

        [data-theme="dark"] .theme-toggle {
            background: rgba(0, 245, 255, 0.15);
            border: 1px solid rgba(0, 245, 255, 0.5);
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00f5ff, #7b2dff, #ff00aa);
        }

        [data-theme="dark"] ::selection {
            background: rgba(0, 245, 255, 0.3);
            color: #fff;
        }


        /* ========== 赛博朋克主题 ========== */
        :root[data-theme="cyberpunk"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-sidebar: #0d0d15;
            --text-primary: #e0e0ff;
            --text-secondary: #a0a0cc;
            --text-muted: #5a5a8a;
            --border-color: #1a1a3a;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff00aa;
            --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #0080ff 50%, #ff00aa 100%);
            --accent-glow: 0 0 20px rgba(0, 240, 255, 0.5);
            --accent-glow-strong: 0 0 30px rgba(0, 240, 255, 0.8), 0 0 60px rgba(0, 240, 255, 0.4);
            --hover-bg: rgba(0, 240, 255, 0.1);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 240, 255, 0.1);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            --code-bg: #0a0a15;
            --tag-bg: rgba(0, 240, 255, 0.15);
            --tag-text: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [data-theme="cyberpunk"] .stat-number {
            font-family: 'Courier New', monospace;
            color: var(--accent-primary);
            text-shadow: var(--accent-glow);
        }

        [data-theme="cyberpunk"] .article-item {
            border-color: var(--border-color);
        }

        [data-theme="cyberpunk"] .article-item:hover,
        [data-theme="cyberpunk"] .article-item.active {
            border-color: var(--accent-primary);
            background: var(--hover-bg);
        }

        [data-theme="cyberpunk"] .form-input,
        [data-theme="cyberpunk"] .editor-input,
        [data-theme="cyberpunk"] .editor-textarea {
            background: var(--code-bg);
            border-color: var(--border-color);
            font-family: 'Courier New', monospace;
        }

        [data-theme="cyberpunk"] .form-input:focus,
        [data-theme="cyberpunk"] .editor-input:focus,
        [data-theme="cyberpunk"] .editor-textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        [data-theme="cyberpunk"] .btn {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        [data-theme="cyberpunk"] .btn-primary {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .btn-primary:hover {
            background: var(--accent-primary);
            color: #0a0a0f;
            box-shadow: var(--accent-glow-strong);
        }

        [data-theme="cyberpunk"] .login-card {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--shadow-lg), var(--accent-glow);
        }

        [data-theme="cyberpunk"] .theme-toggle {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid var(--accent-primary);
        }

        [data-theme="cyberpunk"] .theme-toggle::before {
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        [data-theme="cyberpunk"] ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
        }

        
        /* ========== 霓虹东京主题 ========== */
        :root[data-theme="neontokyo"] {
            --bg-primary: #0f0515;
            --bg-secondary: #1a0a25;
            --bg-sidebar: #150820;
            --text-primary: #f0d0ff;
            --text-secondary: #c8a0e0;
            --text-muted: #6a4a8a;
            --border-color: #2a1545;
            --accent-primary: #ff6ec7;
            --accent-secondary: #7b68ee;
            --accent-gradient: linear-gradient(135deg, #ff6ec7 0%, #9d7fff 50%, #7b68ee 100%);
            --accent-glow: 0 0 25px rgba(255, 110, 199, 0.6);
            --accent-glow-strong: 0 0 40px rgba(255, 110, 199, 0.9), 0 0 80px rgba(123, 104, 238, 0.4);
            --hover-bg: rgba(255, 110, 199, 0.1);
            --shadow-sm: 0 2px 15px rgba(255, 110, 199, 0.2);
            --shadow-md: 0 4px 25px rgba(123, 104, 238, 0.3), 0 0 20px rgba(255, 110, 199, 0.1);
            --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 110, 199, 0.25);
            --code-bg: #120818;
            --tag-bg: rgba(255, 110, 199, 0.15);
            --tag-text: #ff9ed9;
            --pink-glow: 0 0 20px rgba(255, 110, 199, 0.5);
            --purple-glow: 0 0 20px rgba(123, 104, 238, 0.5);
        }

        [data-theme="neontokyo"] body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 110, 199, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(123, 104, 238, 0.08) 0%, transparent 50%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(255, 110, 199, 0.02) 50px,
                    rgba(255, 110, 199, 0.02) 51px
                );
        }

        [data-theme="neontokyo"] .header {
            background: linear-gradient(180deg, #150820 0%, #1a0a25 100%);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #ff6ec7, #7b68ee) 1;
            box-shadow: 0 5px 30px rgba(255, 110, 199, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
        }

        [data-theme="neontokyo"] .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff6ec7, #7b68ee, #ff6ec7, transparent);
            animation: neonFlow 4s linear infinite;
        }

        [data-theme="neontokyo"] .navbar-brand {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;

        /* ========== 基础样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;

            -webkit-text-fill-color: transparent;

            font-size: 16px;

            transition: all 0.2s;

            border-color: #ef4444;

            margin-bottom: 32px;

            margin-bottom: 8px;

            margin-right: 4px;

        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .admin-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.3s;
            color: white;
            font-size: 24px;
        }

        .admin-toggle:hover {
            transform: scale(1.1);
        }

        .admin-toggle.active {
            transform: rotate(45deg);
        }

        .admin-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 240px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .admin-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .menu-item:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .theme-selector {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--code-bg);
            border-radius: 8px;
            margin-top: 8px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-btn:hover, .theme-btn.active {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .main {
                padding: 16px;

            .form-card {
                padding: 20px;

                flex-direction: column;
                align-items: flex-start;
                gap: 12px;

        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

                <input type="text" class="form-input" id="article-title" placeholder="输入文章标题">
            </div>
            <div class="form-group">
                <label class="form-label">内容 (Markdown)</label>
                <textarea class="form-textarea" id="article-content" placeholder="输入文章内容..."></textarea>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn" onclick="createArticle()">发布文章</button>
                <button class="btn secondary" onclick="clearForm()">清空</button>
            </div>
        </div>

        <!-- 文章列表 -->
        <div class="article-list">
            <div style="padding: 20px 24px; border-bottom: 1px solid var(--border-color);">
                <h3>已有文章</h3>
            </div>
            <div id="article-list">
                <div style="padding: 40px; text-align: center; color: var(--text-muted);">加载中...</div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        © 2026 Erudit - 个人知识管理系统
    </footer>

    <!-- 右下角管理面板 -->
    <div class="admin-panel">
        <div class="admin-menu" id="admin-menu">
            <div class="menu-title">主题切换</div>
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="light" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" data-theme="cyberpunk" onclick="setTheme('cyberpunk')">💜 赛博</button>
            </div>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                <div class="menu-title">快捷操作</div>
                <div class="menu-item" onclick="window.location.href='/'">
                    <span>🏠</span> 返回前台
                </div>
                <div class="menu-item" onclick="window.location.href='/docs'">
                    <span>📖</span> API 文档
                </div>
                <div class="menu-item" onclick="window.open('https://github.com/trencps/erudit', '_blank')">
                    <span>⭐</span> GitHub
                </div>
            </div>
        </div>
        <button class="admin-toggle" id="admin-toggle" onclick="toggleAdminMenu()">⚙️</button>
    </div>

    <script>
        let token = localStorage.getItem('erudit-token');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                window.location.href = '/';
            } else {
                loadStats();
                loadArticles();
            }
            loadTheme();
            
            // 点击外部关闭菜单
            document.addEventListener('click', (e) => {
                const panel = document.querySelector('.admin-panel');
                if (!panel.contains(e.target)) {
                    document.getElementById('admin-menu').classList.remove('show');
                    document.getElementById('admin-toggle').classList.remove('active');
                }
            });
        });

        // 加载统计
        async function loadStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                document.getElementById('stat-articles').textContent = data.articles || 0;
                document.getElementById('stat-categories').textContent = data.categories || 0;
                document.getElementById('stat-tags').textContent = data.tags || 0;
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        // 加载文章列表
        async function loadArticles() {
            try {
                const res = await fetch('/articles', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const list = document.getElementById('article-list');
                
                if (data.articles && data.articles.length > 0) {
                    list.innerHTML = data.articles.map(a => `
                        <div class="article-item">
                            <div class="article-info">
                                <h3>${a.title}</h3>
                                <p>${a.created_at || '未知'} ${a.category ? '• ' + a.category : ''}</p>
                            </div>
                            <div class="article-actions">
                                <button class="action-btn" onclick="editArticle('${a.slug}')">编辑</button>
                                <button class="action-btn danger" onclick="deleteArticle('${a.slug}')">删除</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">暂无文章</div>';
                }
            } catch (e) {
                document.getElementById('article-list').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">加载失败</div>';
            }
        }

        // 创建文章
        async function createArticle() {
            const title = document.getElementById('article-title').value.trim();
            const content = document.getElementById('article-content').value.trim();
            
            if (!title || !content) {
                alert('请输入标题和内容');
                return;
            }
            
            try {
                const res = await fetch('/articles', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, content })
                });
                
                if (res.ok) {
                    alert('发布成功！');
                    clearForm();
                    loadArticles();
                    loadStats();
                } else {
                    alert('发布失败，请重试');
                }
            } catch (e) {
                alert('发布失败: ' + e.message);
            }
        }

        // 清空表单
        function clearForm() {
            document.getElementById('article-title').value = '';
            document.getElementById('article-content').value = '';
        }

        // 编辑文章
        function editArticle(slug) {
            window.location.href = `/admin?edit=${slug}`;
        }

        // 删除文章
        async function deleteArticle(slug) {
            if (!confirm('确定要删除这篇文章吗？')) return;
            
            try {
                const res = await fetch(`/articles/${slug}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    loadArticles();
                    loadStats();
                } else {
                    alert('删除失败');
                }
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const themes = ["light", "dark", "cyberpunk", "neontokyo"];
            const idx = themes.indexOf(current);
            const next = themes[(idx + 1) % themes.length];
            html.setAttribute('data-theme', next);
            localStorage.setItem('erudit_theme', next);
            const label = document.getElementById('themeLabel');
            if (label) label.textContent = next.toUpperCase();
        }

        // 初始化主题
        (function initTheme() {
            const saved = localStorage.getItem('erudit_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        async function login() {
            const password = document.getElementById('password').value;
            if (!password) { alert('请输入密码'); return; }
            const resp = await fetch('/api/auth/login?password=' + encodeURIComponent(password));
            const data = await resp.json();
            if (data.token) {
                token = data.token;
                localStorage.setItem('erudit_token', token);
                showMain();
            } else { alert(data.detail || '密码错误'); }
        }

        function showMain() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            loadArticles();
        }

        async function loadArticles() {
            if (!token) return;
            const resp = await fetch('/api/articles?page=1&page_size=50', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await resp.json();
            articles = data.articles || [];
            document.getElementById('statArticles').textContent = data.total || articles.length;
            renderList();
            await loadCategories();
        }

        async function loadCategories() {
            if (!token) return;
            const resp = await fetch('/api/categories', { headers: { 'Authorization': 'Bearer ' + token } });
            categories = await resp.json();
            document.getElementById('statCategories').textContent = categories.length || 0;
        }

        function renderList() {
            document.getElementById('articleList').innerHTML = articles.map(a =>
                '<li class="article-item" onclick="loadArticle(\\'' + a.slug + '\\')">' +
                '<div class="article-item-title">' + escapeHtml(a.title) + '</div>' +
                '<div class="article-item-meta">' + (a.category_id || '未分类') + '</div>' +
                '</li>'
            ).join('');
        }

        async function loadArticle(slug) {
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.article-item').classList.add('active');
            const resp = await fetch('/api/articles/' + slug, { headers: { 'Authorization': 'Bearer ' + token } });
            const article = await resp.json();
            document.getElementById('contentPanel').innerHTML = `
                <div class="content-header">
                    <h2 class="content-title">${escapeHtml(article.title)}</h2>
                    <div class="content-actions">
                        <button class="btn-sm btn-secondary" onclick="exportArticle('${slug}')">📥 导出</button>
                        <button class="btn-sm btn-danger" onclick="deleteArticle('${slug}')">🗑️ 删除</button>
                    </div>
                </div>
                <div class="editor-group">
                    <label class="editor-label">标题</label>
                    <input type="text" class="editor-input" id="editTitle" value="${escapeHtml(article.title)}">
                </div>
                <div class="editor-group">
                    <label class="editor-label">分类</label>
                    <select class="editor-input" id="editCategory">
                        <option value="">无分类</option>
                        ${categories.map(c => `<option value="${c.id}" ${article.category_id == c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                    </select>
                </div>
                <div class="editor-group">
                    <label class="editor-label">内容 (Markdown)</label>
                    <textarea class="editor-textarea" id="editContent">${escapeHtml(article.content)}</textarea>
                </div>
                <div class="content-actions">
                    <button class="btn-sm btn-primary" onclick="saveArticle('${slug}')">保存</button>
                </div>
                <div style="margin-top:1rem;padding:1rem;background:var(--hover-bg);border-radius:8px;">
                    <p><strong>发布:</strong> ${article.created_at}</p>
                    <p><strong>更新:</strong> ${article.updated_at}</p>
                </div>
            `;
        }

        async function saveArticle(slug) {
            const title = document.getElementById('editTitle').value;
            const content = document.getElementById('editContent').value;
            const category_id = document.getElementById('editCategory').value;
            await fetch('/api/articles/' + slug, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, category_id: category_id || null })
            });
        }

        function loadTheme() {
            const saved = localStorage.getItem('erudit-theme') || 'light';
            setTheme(saved);
        }

        // 管理面板切换
        function toggleAdminMenu() {
            const menu = document.getElementById('admin-menu');
            const toggle = document.getElementById('admin-toggle');
            menu.classList.toggle('show');
            toggle.classList.toggle('active');
        }
    </script>
</body>
</html>
