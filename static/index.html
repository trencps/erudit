<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erudit - 个人知识库</title>
    <style>
        /* ========== 梦幻浅色主题 ========== */
        :root[data-theme="light"] {
            --bg-primary: #faf5ff;
            --bg-secondary: #ffffff;
            --bg-sidebar: #f8f0ff;
            --text-primary: #2d1b4e;
            --text-secondary: #5a4575;
            --text-muted: #9a85b5;
            --border-color: #e8dff5;
            --accent-primary: #a855f7;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #c084fc 0%, #a855f7 25%, #ec4899 50%, #f472b6 75%, #fb7185 100%);
            --accent-glow: 0 0 20px rgba(168, 85, 247, 0.3);
            --accent-glow-strong: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 60px rgba(236, 72, 153, 0.3);
            --hover-bg: rgba(168, 85, 247, 0.05);
            --shadow-sm: 0 2px 12px rgba(168, 85, 247, 0.08);
            --shadow-md: 0 4px 24px rgba(168, 85, 247, 0.12), 0 2px 8px rgba(236, 72, 153, 0.06);
            --shadow-lg: 0 10px 40px rgba(168, 85, 247, 0.15), 0 4px 16px rgba(236, 72, 153, 0.08);
            --code-bg: #f5f0ff;
            --tag-bg: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.1));
            --tag-text: #9333ea;
            --card-gradient: linear-gradient(135deg, rgba(192, 132, 252, 0.05) 0%, rgba(244, 114, 182, 0.05) 100%);
            --blur-bg: blur(20px);
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, #faf5ff 0%, #fff0f5 50%, #f0f5ff 100%);
            background-attachment: fixed;
            position: relative;
        }

        [data-theme="light"] body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(192, 132, 252, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        [data-theme="light"] .header {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        [data-theme="light"] .navbar-brand {
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4));
        }

        [data-theme="light"] .navbar-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #7c3aed;
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .navbar-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #a855f7;
            box-shadow: var(--accent-glow);
            transform: translateY(-2px);
        }

        [data-theme="light"] .navbar-btn.primary {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            font-weight: 600;
            box-shadow: var(--accent-glow);
        }

        [data-theme="light"] .navbar-btn.primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="light"] .sidebar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: var(--shadow-md);
        }

        [data-theme="light"] .stat-item {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: var(--shadow-sm);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
        }

        [data-theme="light"] .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="light"] .stat-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        [data-theme="light"] .article-item {
            border: 1px solid rgba(168, 85, 247, 0.1);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .article-item:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        [data-theme="light"] .article-item.active {
            background: linear-gradient(90deg, rgba(192, 132, 252, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            border-color: #a855f7;
            box-shadow: var(--accent-glow);
        }

        [data-theme="light"] .content-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: var(--shadow-lg);
        }

        [data-theme="light"] .form-input,
        [data-theme="light"] .editor-input,
        [data-theme="light"] .editor-select,
        [data-theme="light"] .editor-textarea {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--text-primary);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
        }

        [data-theme="light"] .form-input:focus,
        [data-theme="light"] .editor-input:focus,
        [data-theme="light"] .editor-select:focus,
        [data-theme="light"] .editor-textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1), var(--accent-glow);
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        [data-theme="light"] .btn {
            background: linear-gradient(135deg, #c084fc, #ec4899);
            border: none;
            color: white;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .btn:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="light"] .btn-danger {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
        }

        [data-theme="light"] .btn-danger:hover {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.5);
        }

        [data-theme="light"] .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid rgba(168, 85, 247, 0.2);
            font-size: 0.75rem;
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: var(--shadow-lg), var(--accent-glow);
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        [data-theme="light"] .theme-toggle::before {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        [data-theme="light"] .footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: var(--blur-bg);
            -webkit-backdrop-filter: var(--blur-bg);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
        }

        [data-theme="light"] .empty-state-icon {
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        [data-theme="light"] ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        [data-theme="light"] ::-webkit-scrollbar-track {
            background: rgba(168, 85, 247, 0.05);
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #c084fc, #ec4899);
            border-radius: 4px;
        }

        [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #a855f7, #db2777);
        }

        [data-theme="light"] ::selection {
            background: rgba(168, 85, 247, 0.2);
            color: #7c3aed;
        }


                /* ========== 炫彩黑主题 ========== */
        :root[data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-sidebar: #0d0d15;
            --text-primary: #e8e8ff;
            --text-secondary: #b0b0cc;
            --text-muted: #5a5a7a;
            --border-color: #1e1e3a;
            --accent-primary: #00f5ff;
            --accent-secondary: #ff00aa;
            --accent-gradient: linear-gradient(135deg, #00f5ff 0%, #7b2dff 25%, #ff00aa 50%, #ffaa00 75%, #00ff88 100%);
            --accent-glow: 0 0 25px rgba(0, 245, 255, 0.6), 0 0 50px rgba(123, 45, 255, 0.3);
            --accent-glow-strong: 0 0 40px rgba(0, 245, 255, 0.8), 0 0 80px rgba(255, 0, 170, 0.4);
            --hover-bg: rgba(0, 245, 255, 0.08);
            --shadow-sm: 0 2px 15px rgba(0, 0, 0, 0.6);
            --shadow-md: 0 4px 25px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 245, 255, 0.1);
            --shadow-lg: 0 10px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(123, 45, 255, 0.2);
            --code-bg: #0a0a18;
            --tag-bg: linear-gradient(135deg, rgba(0, 245, 255, 0.15), rgba(255, 0, 170, 0.15));
            --tag-text: #00f5ff;
            --rainbow-border: linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff);
        }

        [data-theme="dark"] body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(0, 245, 255, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 0, 170, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(123, 45, 255, 0.05) 0%, transparent 60%);
            position: relative;
        }

        [data-theme="dark"] body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 0%, rgba(0, 245, 255, 0.02) 50%, transparent 100%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 245, 255, 0.015) 2px,
                    rgba(0, 245, 255, 0.015) 4px
                );
            pointer-events: none;
            z-index: 0;
        }

        [data-theme="dark"] .header {
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.95) 0%, rgba(18, 18, 26, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
            border-image: var(--rainbow-border) 1;
            box-shadow: 0 4px 30px rgba(0, 245, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        [data-theme="dark"] .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00f5ff, #7b2dff, #ff00aa, #ffaa00, #00ff88, transparent);
            animation: rainbowFlow 4s linear infinite;
        }

        @keyframes rainbowFlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        [data-theme="dark"] .navbar-brand {
            font-weight: 700;
            background: linear-gradient(90deg, #00f5ff, #7b2dff, #ff00aa, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.6));
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 0, 170, 0.8)); }
        }

        [data-theme="dark"] .navbar-btn {
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.3);
            color: #00f5ff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .navbar-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        [data-theme="dark"] .navbar-btn:hover::before {
            left: 100%;
        }

        [data-theme="dark"] .navbar-btn:hover {
            background: rgba(0, 245, 255, 0.15);
            border-color: #00f5ff;
            box-shadow: var(--accent-glow);
            transform: translateY(-2px);
            color: #fff;
        }

        [data-theme="dark"] .navbar-btn.primary {
            background: linear-gradient(135deg, #00f5ff, #7b2dff);
            color: #fff;
            border: none;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
        }

        [data-theme="dark"] .navbar-btn.primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="dark"] .sidebar {
            background: linear-gradient(180deg, rgba(13, 13, 21, 0.95) 0%, rgba(18, 18, 26, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid transparent;
            border-image: var(--rainbow-border) 1;
            box-shadow: 4px 0 30px rgba(0, 245, 255, 0.1);
            position: relative;
        }

        [data-theme="dark"] .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--rainbow-border);
        }

        [data-theme="dark"] .stat-item {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.08) 0%, rgba(123, 45, 255, 0.08) 50%, rgba(255, 0, 170, 0.08) 100%);
            border: 1px solid rgba(0, 245, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .stat-item::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 245, 255, 0.1), transparent, rgba(255, 0, 170, 0.1), transparent);
            animation: hologramSpin 8s linear infinite;
        }

        @keyframes hologramSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        [data-theme="dark"] .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00f5ff, #7b2dff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.5));
            position: relative;
            z-index: 1;
        }

        [data-theme="dark"] .stat-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        [data-theme="dark"] .article-item {
            border: 1px solid var(--border-color);
            background: rgba(0, 245, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
        }

        [data-theme="dark"] .article-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 2px;
            background: linear-gradient(180deg, #00f5ff, #7b2dff, #ff00aa);
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        [data-theme="dark"] .article-item:hover::before {
            opacity: 1;
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.8);
        }

        [data-theme="dark"] .article-item:hover {
            border-color: rgba(0, 245, 255, 0.4);
            background: rgba(0, 245, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
            transform: translateX(4px);
        }

        [data-theme="dark"] .article-item.active {
            background: linear-gradient(90deg, rgba(0, 245, 255, 0.15) 0%, rgba(123, 45, 255, 0.15) 100%);
            border-color: #00f5ff;
            box-shadow: var(--accent-glow);
        }

        [data-theme="dark"] .content-panel {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        [data-theme="dark"] .content-panel::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, transparent 50%, rgba(0, 245, 255, 0.1) 50%);
            pointer-events: none;
        }

        [data-theme="dark"] .form-input,
        [data-theme="dark"] .editor-input,
        [data-theme="dark"] .editor-select,
        [data-theme="dark"] .editor-textarea {
            background: rgba(10, 10, 18, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] .form-input:focus,
        [data-theme="dark"] .editor-input:focus,
        [data-theme="dark"] .editor-select:focus,
        [data-theme="dark"] .editor-textarea:focus {
            border-color: #00f5ff;
            box-shadow: 
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 245, 255, 0.3),
                0 0 40px rgba(123, 45, 255, 0.2);
            outline: none;
        }

        [data-theme="dark"] .btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(123, 45, 255, 0.2));
            border: 1px solid rgba(0, 245, 255, 0.4);
            color: #00f5ff;
        }

        [data-theme="dark"] .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.4), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        [data-theme="dark"] .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        [data-theme="dark"] .btn-primary {
            background: linear-gradient(135deg, #00f5ff, #7b2dff);
            border: none;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        [data-theme="dark"] .btn-primary:hover {
            box-shadow: var(--accent-glow-strong);
            transform: translateY(-2px);
        }

        [data-theme="dark"] .btn-danger {
            background: linear-gradient(135deg, #ff0055, #ff00aa);
            border: none;
            color: #fff;
        }

        [data-theme="dark"] .btn-danger:hover {
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
        }

        [data-theme="dark"] .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid rgba(0, 245, 255, 0.3);
            font-size: 0.75rem;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.2);
        }

        [data-theme="dark"] .login-card {
            background: linear-gradient(135deg, rgba(18, 18, 26, 0.9), rgba(13, 13, 21, 0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 245, 255, 0.3);
            box-shadow: var(--shadow-lg), var(--accent-glow);
            position: relative;
        }

        [data-theme="dark"] .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00f5ff, #7b2dff, #ff00aa, #ffaa00, #00ff88, #00f5ff);
            background-size: 400% 400%;
            z-index: -1;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        [data-theme="dark"] .theme-toggle {
            background: rgba(0, 245, 255, 0.15);
            border: 1px solid rgba(0, 245, 255, 0.5);
        }

        [data-theme="dark"] .theme-toggle::before {
            background: linear-gradient(135deg, #00f5ff, #7b2dff);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.8);
        }

        /* ========== 基础样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        [data-theme="cyberpunk"] body {
            background: var(--bg-primary);
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.02) 2px, rgba(0, 240, 255, 0.02) 4px),
                linear-gradient(180deg, rgba(0, 240, 255, 0.02) 0%, transparent 50%, rgba(255, 0, 170, 0.02) 100%);
        }

        /* ========== 页头 ========== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
        }

        [data-theme="cyberpunk"] .header {
            background: linear-gradient(180deg, #0a0a15 0%, #12121a 100%);
            border-bottom: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        [data-theme="cyberpunk"] .navbar-brand {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: var(--accent-glow);
        }

        .navbar-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .nav-btn.primary {
            background: var(--accent-gradient);
            color: white;
        }

        .nav-btn.primary:hover {
            opacity: 0.9;
            box-shadow: var(--accent-glow);
        }

        /* ========== 主体布局 ========== */
        .main {
            display: flex;
            min-height: calc(100vh - 64px);
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            overflow-y: auto;
            transition: all 0.3s;
        }

        [data-theme="cyberpunk"] .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            box-shadow: inset -1px 0 20px rgba(0, 240, 255, 0.05);
        }

        .stats-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .stat-number {
            text-shadow: var(--accent-glow);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 12px 8px;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .article-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .article-item:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .article-item.active {
            background: var(--hover-bg);
            color: var(--accent-primary);
            font-weight: 600;
        }

        [data-theme="cyberpunk"] .article-item {
            border-left: 2px solid transparent;
        }

        [data-theme="cyberpunk"] .article-item:hover,
        [data-theme="cyberpunk"] .article-item.active {
            border-left-color: var(--accent-primary);
            background: var(--hover-bg);
        }

        .article-title {
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .article-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 内容区 ========== */
        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .login-card {
            max-width: 400px;
            margin: 60px auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }

        [data-theme="cyberpunk"] .login-card {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent-gradient);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }

        .article-view {
            max-width: 800px;
        }

        .article-header {
            margin-bottom: 32px;
        }

        .article-title-main {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .article-meta {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .article-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .article-content h1, .article-content h2, .article-content h3 {
            margin: 32px 0 16px;
            color: var(--text-primary);
        }

        .article-content p {
            margin-bottom: 16px;
        }

        .article-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
        }

        .article-content pre {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .article-content pre code {
            background: none;
            padding: 0;
        }

        .article-content blockquote {
            border-left: 4px solid var(--accent-primary);
            padding-left: 20px;
            margin: 16px 0;
            color: var(--text-muted);
        }

        .article-content img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
        }

        .article-content a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        .article-content a:hover {
            text-decoration: underline;
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .article-content th, .article-content td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        .article-content th {
            background: var(--code-bg);
            font-weight: 600;
        }

        .article-content ul, .article-content ol {
            padding-left: 24px;
            margin: 16px 0;
        }

        .article-content li {
            margin: 8px 0;
        }

        /* ========== 右下角管理面板 ========== */
        .admin-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .admin-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--accent-glow-strong);
            transition: all 0.3s;
            color: white;
            font-size: 24px;
        }

        .admin-toggle:hover {
            transform: scale(1.1);
        }

        .admin-toggle.active {
            transform: rotate(45deg);
        }

        [data-theme="cyberpunk"] .admin-toggle {
            box-shadow: var(--accent-glow-strong);
            border: 1px solid var(--accent-primary);
        }

        .admin-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .admin-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        [data-theme="cyberpunk"] .admin-menu {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .menu-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .menu-item:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .menu-item-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--code-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .menu-item-content {
            flex: 1;
        }

        .menu-item-title {
            font-size: 14px;
            font-weight: 500;
        }

        .menu-item-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 主题选择器 ========== */
        .theme-selector {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--code-bg);
            border-radius: 8px;
            margin-top: 8px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-btn:hover, .theme-btn.active {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        [data-theme="cyberpunk"] .theme-btn.active {
            border-color: var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        /* ========== 登录弹窗 ========== */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .login-modal.show {
            opacity: 1;
            visibility: visible;
        }

        [data-theme="cyberpunk"] .login-modal {
            background: rgba(0, 0, 0, 0.8);
        }

        .login-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 400px;
            transform: scale(0.9);
            transition: all 0.3s;
        }

        .login-modal.show .login-modal-content {
            transform: scale(1);
        }

        [data-theme="cyberpunk"] .login-modal-content {
            border: 1px solid var(--accent-primary);
            box-shadow: var(--accent-glow-strong);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--code-bg);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px 32px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.3s;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--accent-primary);
        }

        .footer-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-divider {
            color: var(--text-muted);
        }

        .footer-info a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-info a:hover {
            color: var(--accent-primary);
        }

        .footer-links a:hover {
            color: var(--accent-primary);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .content {
                padding: 16px;
            }

            .article-title-main {
                font-size: 24px;
            }

            .admin-panel {
                bottom: 16px;
                right: 16px;
            }

            .admin-menu {
                right: -8px;
                min-width: 260px;
            }
        }

        /* ========== 加载动画 ========== */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>
<body>
    <!-- 页头 -->
    <header class="header">
        <nav class="navbar">
            <a href="/" class="navbar-brand">📚 Erudit</a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
            <div class="navbar-menu" id="navMenu">
                <button class="navbar-btn" onclick="showSearch()">🔍 搜索</button>
                <button class="navbar-btn" onclick="showRSS()">📡 RSS</button>
                <div class="navbar-btn" onclick="toggleTheme()" title="切换主题">
                    <span id="themeLabel">CYBER</span>
                    <span class="theme-icon">☀️</span>
                    <button class="theme-toggle"></button>
                    <span class="theme-icon">🌙</span>
                </div>
                <button class="navbar-btn primary" onclick="location.href='/admin'">⚙️ 管理后台</button>
            </div>
        </nav>
    </header>

    <!-- 主体 -->
    <div class="main">
        <!-- 侧边栏 -->
        <aside class="sidebar">
                <div class="stat-item">
                    <span class="stat-label">标签数</span>
                    <span class="stat-number" id="stat-tags">0</span>
                </div>
            </div>

            <!-- 文章列表 -->
            <div class="section-title">文章列表</div>
            <div class="article-list" id="article-list">
                <div class="loading">加载中</div>
            </div>
        </aside>

        <!-- 内容区 -->
        <main class="content" id="content">
            <div class="loading">加载中</div>
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-links">
            <a href="/">首页</a>
            <a href="/docs">API 文档</a>
            <a href="https://github.com/trencps/erudit" target="_blank">GitHub</a>
        </div>
        <div class="footer-info">
            <span>© 2026 Erudit v3.0.0 - 个人知识管理系统</span>
            <span class="footer-divider">|</span>
            <span>友情链接:</span>
            <a href="https://hermes-studio.ai" target="_blank">Hermes Studio</a>
            <a href="https://github.com/EKKOLearnAI" target="_blank">EKKOLearnAI</a>
        </div>
    </footer>

    <!-- 右下角管理面板 -->
    <div class="admin-panel">
        <div class="admin-menu" id="admin-menu">
            <div class="menu-title">管理面板</div>
            
            <!-- 主题切换 -->
            <div class="menu-item" onclick="toggleThemeMenu()">
                <div class="menu-item-icon">🎨</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">主题切换</div>
                    <div class="menu-item-desc">切换界面主题</div>
                </div>
            </div>
            <div class="theme-selector" id="theme-selector" style="display: none;">
                <button class="theme-btn active" data-theme="light" onclick="setTheme('light')">☀️ 浅色</button>
                <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 深色</button>
                <button class="theme-btn" data-theme="cyberpunk" onclick="setTheme('cyberpunk')">💜 赛博</button>
            </div>

            <!-- 后台登录 -->
            <div class="menu-item" onclick="showLoginModal()">
                <div class="menu-item-icon">🔐</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">后台登录</div>
                    <div class="menu-item-desc">管理员登录</div>
                </div>
            </div>

            <!-- API 文档 -->
            <div class="menu-item" onclick="window.open('/docs', '_blank')">
                <div class="menu-item-icon">📖</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">API 文档</div>
                    <div class="menu-item-desc">接口文档</div>
                </div>
            </div>

            <!-- RSS 订阅 -->
            <div class="menu-item" onclick="showRSS()">
                <div class="menu-item-icon">📡</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">RSS 订阅</div>
                    <div class="menu-item-desc">订阅最新文章</div>
                </div>
            </div>

            <!-- GitHub -->
            <div class="menu-item" onclick="window.open('https://github.com/trencps/erudit', '_blank')">
                <div class="menu-item-icon">⭐</div>
                <div class="menu-item-content">
                    <div class="menu-item-title">GitHub</div>
                    <div class="menu-item-desc">查看源码</div>
                </div>
            </div>
        </div>
        <button class="admin-toggle" id="admin-toggle" onclick="toggleAdminMenu()">⚙️</button>
    </div>

    <!-- 登录弹窗 -->
    <div class="login-modal" id="login-modal">
        <div class="login-modal-content">
            <div class="modal-header">
                <div class="modal-title">后台登录</div>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="login-password" placeholder="请输入管理密码">
            </div>
            <button class="btn" onclick="doLogin()">登录</button>
            <div class="error-msg" id="login-error"></div>
        </div>
    </div>

    <script>
        let currentArticle = null;
        let token = null;

        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('active');
        }

        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const themes = ["light", "dark", "cyberpunk", "neontokyo"];
            const idx = themes.indexOf(current);
            const next = themes[(idx + 1) % themes.length];
            html.setAttribute('data-theme', next);
            localStorage.setItem('erudit_theme', next);
            const label = document.getElementById('themeLabel');
            if (label) label.textContent = next.toUpperCase();
        }

        // 初始化主题
        (function initTheme() {
            const saved = localStorage.getItem('erudit_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        async function login() {
            const password = document.getElementById('password').value;
            if (!password) { alert('请输入密码'); return; }
            const resp = await fetch('/api/auth/login?password=' + encodeURIComponent(password));
            const data = await resp.json();
            if (data.token) {
                token = data.token;
                localStorage.setItem('erudit_token', token);
                showMain();
            } else { alert(data.detail || '密码错误'); }
        }

        function showMain() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            loadArticles();
            loadTheme();
            
            // 点击外部关闭菜单
            document.addEventListener('click', (e) => {
                const panel = document.querySelector('.admin-panel');
                if (!panel.contains(e.target)) {
                    document.getElementById('admin-menu').classList.remove('show');
                    document.getElementById('admin-toggle').classList.remove('active');
                }
            });
        });

        // 加载统计
        async function loadStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                console.log('Stats response:', data);
                document.getElementById('stat-articles').textContent = data.articles || 0;
                document.getElementById('stat-categories').textContent = data.categories || 0;
                document.getElementById('stat-tags').textContent = data.tags || 0;
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        // 加载文章列表
        async function loadArticles(categoryId = 'all') {
            try {
                const res = await fetch('/articles');
                const data = await res.json();
                console.log('Articles response:', data);
                const list = document.getElementById('article-list');
                
                let articles = data.articles || [];
                if (categoryId !== 'all') {
                    articles = articles.filter(a => a.category_id === parseInt(categoryId));
                }
                
                if (articles.length > 0) {
                    list.innerHTML = articles.map(a => `
                        <div class="article-item" onclick="showArticle('${a.slug}')">
                            <div class="article-title">${a.title}</div>
                            <div class="article-meta">${a.created_at || '未知时间'}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="loading">暂无文章</div>';
                }
            } catch (e) {
                console.error('Load articles error:', e);
                document.getElementById('article-list').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 分类筛选
        function filterCategory(categoryId) {
            // 更新按钮状态
            document.querySelectorAll('#category-nav .nav-btn').forEach(btn => {
                btn.classList.remove('active');
                if (categoryId === 'all' && btn.textContent === '全部') {
                    btn.classList.add('active');
                } else if (btn.dataset.categoryId === categoryId) {
                    btn.classList.add('active');
                }
            });
            loadArticles(categoryId);
        }

        // 显示文章
        async function showArticle(slug) {
            try {
                const res = await fetch(`/articles/${slug}`);
                const data = await res.json();
                console.log('Article data:', data);
                currentArticle = data;
                
                // 高亮当前文章
                document.querySelectorAll('.article-item').forEach(el => {
                    el.classList.remove('active');
                    if (el.onclick && el.onclick.toString().includes(slug)) {
                        el.classList.add('active');
                    }
                });
                
                // 渲染内容
                const content = data.content || '';
                document.getElementById('content').innerHTML = `
                    <div class="article-view">
                        <div class="article-header">
                            <h1 class="article-title-main">${data.title}</h1>
                            <div class="article-meta">
                                <span>📅 ${data.created_at || '未知'}</span>
                                ${data.category ? `<span>📁 ${data.category}</span>` : ''}
                                ${data.tags ? `<span>🏷️ ${typeof data.tags === 'string' ? data.tags : data.tags.join(', ')}</span>` : ''}
                            </div>
                        </div>
                        <div class="article-content">${markdownToHtml(content)}</div>
                    </div>
                `;
            } catch (e) {
                console.error('Show article error:', e);
                document.getElementById('content').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 简单的 Markdown 转 HTML
        function markdownToHtml(md) {
            if (!md) return '';
            return md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/\n/gim, '<br />');
        }

        // 搜索
        function showSearch() {
            const keyword = prompt('请输入搜索关键词:');
            if (keyword) {
                window.location.href = `/search?keyword=${encodeURIComponent(keyword)}`;
            }
        }

        // RSS
        function showRSS() {
            window.open('/rss', '_blank');
        }

        // 管理面板切换
        function toggleAdminMenu() {
            const menu = document.getElementById('admin-menu');
            const toggle = document.getElementById('admin-toggle');
            menu.classList.toggle('show');
            toggle.classList.toggle('active');
        }

        // 主题菜单切换
        function toggleThemeMenu() {
            const selector = document.getElementById('theme-selector');
            selector.style.display = selector.style.display === 'none' ? 'flex' : 'none';
        }

        // 设置主题
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('erudit-theme', theme);
            
            // 更新按钮状态
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        // 加载主题
        function loadTheme() {
            const saved = localStorage.getItem('erudit-theme') || 'light';
            setTheme(saved);
        }

        // 登录弹窗
        function showLoginModal() {
            document.getElementById('login-modal').classList.add('show');
            document.getElementById('login-password').focus();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('show');
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').textContent = '';
        }

        // 登录
        async function doLogin() {
            const password = document.getElementById('login-password').value;
            if (!password) {
                document.getElementById('login-error').textContent = '请输入密码';
                return;
            }
            
            try {
                const res = await fetch(`/api/auth/login?password=${encodeURIComponent(password)}`);
                const data = await res.json();
                
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('erudit-token', token);
                    closeLoginModal();
                    alert('登录成功！');
                    window.location.href = '/admin';
                } else {
                    document.getElementById('login-error').textContent = '密码错误';
                }
            } catch (e) {
                document.getElementById('login-error').textContent = '登录失败，请重试';
            }
        }

        // 回车登录
        document.getElementById('login-password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
